name: Setup .NET SDK & Tools
description: Setup .NET SDK and restore dotnet tools for GitHub Actions
runs:
  using: composite
  steps:
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 11.0.x
      env:
        DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
        DOTNET_CLI_TELEMETRY_OPTOUT: 1
        DOTNET_NOLOGO: 1

    # Keep one SDK install sufficient: let build-time .NET tools that target older runtimes (e.g.
    # Refitter) run on the installed runtime. Permanent policy, not a workaround for one tool.
    - name: Allow major runtime roll-forward
      shell: bash
      run: echo DOTNET_ROLL_FORWARD=Major >> "$GITHUB_ENV"

    # A cold tool resolver cache makes the first restore misattribute commands between packages
    # once the manifest holds a RID-specific tool (GitVersion 7); the retry runs with a warm cache.
    # Remove the retry once https://github.com/dotnet/sdk/issues/53783 is fixed.
    - name: Restore dotnet tools
      shell: bash
      run: dotnet tool restore || dotnet tool restore
