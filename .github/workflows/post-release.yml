# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Post Release

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag_name:
        required: true
        type: string
        description: The published release tag to process

env:
  TAG: ${{ github.event.release.tag_name || github.event.inputs.tag_name }}

permissions:
  contents: read

jobs:
  deploy-schemas:
    name: Deploy Schemas
    uses: $/.github/workflows/reusable-deploy-schemas.yml
    secrets: inherit

  update-homebrew:
    name: Update Homebrew Tap
    if: github.event_name == 'release' && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - name: Generate Homebrew Tap Token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RECYCLARR_APP_CLIENT_ID }}
          private-key: ${{ secrets.RECYCLARR_PRIVATE_KEY }}
          repositories: homebrew-recyclarr
          permission-actions: write

      - name: Update Homebrew Tap
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          version="${TAG#v}"
          gh workflow run update-formula.yml \
            --repo recyclarr/homebrew-recyclarr \
            -f version="$version"

  release-comments:
    name: Release Comments
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RECYCLARR_APP_CLIENT_ID }}
          private-key: ${{ secrets.RECYCLARR_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write

      - name: Comment on Released Items
        uses: $/.github/actions/release-comments
        with:
          tag: ${{ env.TAG }}
          token: ${{ steps.app-token.outputs.token }}

  notify:
    name: Discord Notification
    needs: [deploy-schemas, update-homebrew]
    if: |
      always() &&
      needs.deploy-schemas.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.update-homebrew.result)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get Release Info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method GET "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > release.json
          jq -r '.assets[].browser_download_url' release.json > assets.txt
          jq -r '.body' release.json > changelog.txt

      - name: Setup uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: >
          ./ci/notify/discord_notify.py
          --version "$TAG"
          --repo "$GITHUB_REPOSITORY"
          --webhook-url "$DISCORD_WEBHOOK"
          --changelog changelog.txt
          --assets assets.txt
