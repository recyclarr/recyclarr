name: OpenAPI Spec Sync

on:
  schedule:
    - cron: "0 6 * * 1" # Weekly on Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: Sonarr v3
            target: sonarr-v3
            local: src/Recyclarr.Api.Sonarr/V3/openapi.json
            branch: upstream/sonarr-openapi
          - name: Sonarr v5
            target: sonarr-v5
            local: src/Recyclarr.Api.Sonarr/V5/openapi.json
            branch: upstream/sonarr-v5-openapi
          - name: Radarr
            target: radarr-v3
            local: src/Recyclarr.Api.Radarr/openapi.json
            branch: upstream/radarr-openapi

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Update ${{ matrix.name }} OpenAPI spec
        run: ./scripts/update_openapi.py ${{ matrix.target }}

      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RECYCLARR_APP_CLIENT_ID }}
          private-key: ${{ secrets.RECYCLARR_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ matrix.branch }}
          add-paths: ${{ matrix.local }}
          sign-commits: true
          delete-branch: true
          commit-message: "chore: update ${{ matrix.name }} OpenAPI spec"
          title: "chore: update ${{ matrix.name }} OpenAPI spec"
          body: |
            Automated update of the ${{ matrix.name }} OpenAPI spec from upstream.

            Generated by `scripts/update_openapi.py ${{ matrix.target }}`.
          labels: no-release-comment
          assignees: rcdailey
