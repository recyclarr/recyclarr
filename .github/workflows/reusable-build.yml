# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: ⚙️ Build & Test

on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: true
      runtime:
        type: string
        required: true
      publish-args:
        type: string
      # For runtimes the runner cannot execute (e.g. musl on a glibc runner)
      skip-smoke:
        type: boolean

jobs:
  build:
    name: Publish & Smoke
    # Windows version info missing? See this:
    # https://github.com/dotnet/runtime/issues/3828
    runs-on: ${{ inputs.platform }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # avoid shallow clone for GitVersion
          persist-credentials: false

      - name: Setup .NET & Tools
        uses: $/.github/actions/setup-dotnet

      - name: Publish
        shell: bash
        env:
          RUNTIME: ${{ inputs.runtime }}
          PUBLISH_ARGS: ${{ inputs.publish-args }}
        # PUBLISH_ARGS is unquoted so it splits into separate flags
        run: ci/publish.sh "$RUNTIME" $PUBLISH_ARGS

      # Runner images disagree on interpreter names; macOS lacks `python`, Windows lacks `python3`
      - name: Setup Python
        if: endsWith(inputs.runtime, 'x64') && !inputs.skip-smoke
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Smoke
        if: endsWith(inputs.runtime, 'x64') && !inputs.skip-smoke
        shell: bash
        env:
          RUNTIME: ${{ inputs.runtime }}
        run: python ci/smoke-test.py "publish/$RUNTIME"

      - name: Upload Artifact
        uses: $/.github/actions/upload-tar
        with:
          name: ${{ inputs.runtime }}
          path: publish/${{ inputs.runtime }}
