name: Update Sponsors
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [master]
    paths:
      - .github/workflows/sponsors.yml

permissions:
  contents: read

jobs:
  update-sponsors:
    runs-on: ubuntu-latest
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RECYCLARR_APP_CLIENT_ID }}
          private-key: ${{ secrets.RECYCLARR_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Generate Sponsors
        uses: JamesIves/github-sponsors-readme-action@02650b8cd445fc16dfef73195f9c406dce041623 # v1.6.1
        with:
          token: ${{ secrets.SPONSORS_PAT }}
          file: README.md
          active-only: false
          template: >-
            <a href="https://github.com/{{ login }}"><img src="{{ avatarUrl }}" width="60px"
            alt="User avatar: {{#name}}{{ name }}{{/name}}{{^name}}{{ login }}{{/name}}" /></a>

      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "chore: update sponsors in README"
