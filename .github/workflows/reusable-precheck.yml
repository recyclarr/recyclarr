# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: ⚙️ Pre-Check for Duplicate Runs

on:
  workflow_call:
    outputs:
      should_run:
        description: >-
          Whether the calling workflow should run (false for a feature-branch push that has a PR)
        value: ${{ jobs.precheck.outputs.should_run }}
      full_build:
        description: >-
          Whether to build every platform and run release-only jobs (master, tags, manual runs)
        value: ${{ jobs.precheck.outputs.full_build }}
      publish_dev:
        description: >-
          Whether to publish the dev image and chart (not a tag; fork pull requests get a
          read-only token)
        value: ${{ jobs.precheck.outputs.publish_dev }}

permissions:
  pull-requests: read

jobs:
  precheck:
    name: Duplicate Runs
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      full_build: ${{ steps.check.outputs.full_build }}
      publish_dev: >-
        ${{ github.ref_type != 'tag' && (github.event_name != 'pull_request'
        || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - name: Check if push event has corresponding PR
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" \
            || "${{ github.ref_type }}" == "tag" \
            || "${{ github.ref_name }}" == "master" ]]; then
            echo "full_build=true" >> $GITHUB_OUTPUT
          else
            echo "full_build=false" >> $GITHUB_OUTPUT
          fi

          # Always run for non-push events (prioritize PR builds, workflow_dispatch, etc.)
          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "Event type: ${{ github.event_name }} - allowing run"
            exit 0
          fi

          # Merged commits on master have PRs too, so only feature-branch pushes are deduplicated.
          if [[ "${{ github.ref_type }}" == "tag" || "${{ github.ref_name }}" == "master" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "Push to ${{ github.ref_name }} - allowing run"
            exit 0
          fi

          # For push events, check if there's an open PR for this SHA
          echo "Checking for PRs associated with commit ${{ github.sha }}"
          PR_COUNT=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/pulls \
            --jq 'length' 2>/dev/null || echo "0")

          if [[ "$PR_COUNT" -gt 0 ]]; then
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "Found $PR_COUNT PR(s) for this commit - skipping push event run"
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "No PRs found for this commit - allowing push event run"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
