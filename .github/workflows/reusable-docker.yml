# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: ⚙️ Docker Build & Publish

on:
  workflow_call:
    inputs:
      target:
        description: >-
          dev publishes ghcr.io/<owner>/recyclarr-dev:<branch key>; release publishes version
          tags to Docker Hub and GHCR
        type: string
        required: true

env:
  # Fork pull requests get a read-only token, so they only validate the image.
  SHOULD_PUBLISH: >-
    ${{ inputs.target == 'release' || github.event_name != 'pull_request'
    || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # avoid shallow clone for GitVersion
          persist-credentials: false

      - name: Download Binaries
        uses: $/.github/actions/download-tar
        with:
          path: publish
          pattern: linux-musl-*

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Branch Key
        if: inputs.target == 'dev'
        id: branch
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: echo "key=$(ci/branch-key.sh "$BRANCH")" >> "$GITHUB_OUTPUT"

      - name: Set Dev Docker Tags
        if: inputs.target == 'dev'
        id: dev-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/recyclarr-dev
          flavor: latest=false
          tags: type=raw,value=${{ steps.branch.outputs.key }}

      - name: Setup GitVersion
        if: inputs.target == 'release'
        uses: $/.github/actions/setup-gitversion
        id: gitversion

      - name: Set Release Docker Tags
        if: inputs.target == 'release'
        id: release-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          semver: >-
            type=semver,
            value=${{ steps.gitversion.outputs.semVer }}
          prod: >-
            enable=${{ github.ref_type == 'tag' && steps.gitversion.outputs.preReleaseTag == '' }}
        with:
          images: |
            ${{ github.repository }}
            ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            ${{ env.semver }},${{ env.prod }},pattern={{version}}
            ${{ env.semver }},${{ env.prod }},pattern={{major}}.{{minor}}
            ${{ env.semver }},${{ env.prod }},pattern={{major}}

      - name: Login to Docker Hub
        if: inputs.target == 'release'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        if: env.SHOULD_PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          push: ${{ env.SHOULD_PUBLISH == 'true' }}
          no-cache: true
          platforms: linux/arm/v7,linux/arm64,linux/amd64
          tags: ${{ steps.dev-meta.outputs.tags || steps.release-meta.outputs.tags }}
          labels: ${{ steps.dev-meta.outputs.labels || steps.release-meta.outputs.labels }}
          # Added to prevent tons of untagged images in GHCR.
          # See: https://github.com/docker/build-push-action/issues/894
          provenance: false
