# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: ⚙️ Helm Chart Validate

on:
  workflow_call:

env:
  CHART_DIR: charts/recyclarr
  # renovate: datasource=github-releases depName=helm-unittest/helm-unittest
  HELM_UNITTEST_VERSION: v1.3.0

jobs:
  helm:
    name: Validate Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # avoid shallow clone for GitVersion
          persist-credentials: false

      - name: Setup GitVersion
        uses: $/.github/actions/setup-gitversion
        id: gitversion

      - name: Setup Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2

      - name: Setup chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Lint
        run: ct lint --config .github/ct.yaml

      # Installs only the chart tools from .config/mise.toml. No cache: the release publishes the
      # chart this job packages.
      - name: Setup Chart Tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: aqua:dadav/helm-schema github:grafana/dashboard-linter
          cache: false

      # Same command as the helm-schema mise task, checking instead of writing
      - name: Schema Check
        run: >-
          helm-schema --chart-search-root "$CHART_DIR" --no-dependencies
          --skip-auto-generation title,description,required,default --append-newline --check

      - name: Dashboard Lint
        run: dashboard-linter lint --strict "$CHART_DIR/dashboards/recyclarr.json"

      - name: Unit Tests
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest \
            --version "$HELM_UNITTEST_VERSION" --verify=false
          helm unittest --strict "$CHART_DIR"

      # Paths the install test cannot reach: existing objects, claim data sources, and CRD-backed
      # resources render, and invalid values fail.
      - name: Render Checks
        run: |
          key=--set=apiKey.value=0123456789abcdef0123456789abcdef
          source=(--set=persistence.state.dataSourceRef.apiGroup=snapshot.storage.k8s.io
            --set=persistence.state.dataSourceRef.kind=VolumeSnapshot
            --set=persistence.state.dataSourceRef.name=s)
          helm template t "$CHART_DIR" "$key" > /dev/null
          helm template t "$CHART_DIR" "$key" "${source[@]}" > /dev/null
          helm template t "$CHART_DIR" "$key" "${source[@]}" --set=controller.kind=StatefulSet \
            --set=persistence.data.enabled=true > /dev/null
          helm template t "$CHART_DIR" --set=apiKey.existingSecret=s \
            --set=configs.existingConfigMap=c --set=includes.existingConfigMap=i \
            --set=settings.existingConfigMap=st --set=persistence.state.existingClaim=pvc \
            --set=persistence.data.enabled=true --set=persistence.data.existingClaim=data \
            --set=serviceMonitor.enabled=true --set=prometheusRule.enabled=true \
            --set=grafanaDashboard.enabled=true --set=grafanaDashboard.grafanaOperator.enabled=true \
            --set=grafanaDashboard.grafanaOperator.matchLabels.dashboards=grafana \
            --set=priorityClassName=p --set=imagePullSecrets[0].name=reg > /dev/null
          # errexit ignores commands negated with !, so each rejection is checked explicitly
          reject() {
            if helm template t "$CHART_DIR" "$@" > /dev/null 2>&1; then
              echo "::error::Rendered values that must be rejected: $*"
              exit 1
            fi
          }
          reject
          reject --set=apiKey.value=short
          reject "$key" --set=apiKey.existingSecret=s
          reject "$key" --set=configs.existingConfigMap=c --set=configs.files.a\\.yml=b
          reject "$key" --set=configs.files.a\\.txt=b
          reject "$key" --set=persistance.state.enabled=false
          reject "$key" --set=persistence.data.enabled=true \
            --set=persistence.state.existingClaim=pvc --set=persistence.data.existingClaim=pvc
          reject "$key" --set=service.port=7983
          reject "$key" --set=env[0].name=RECYCLARR_API_KEY --set=env[0].value=k
          reject "$key" --set=env[0].name=RECYCLARR_API_KEY_FILE --set=env[0].value=/k
          reject "$key" --set=controller.kind=DaemonSet
          reject "$key" "${source[@]}" --set=persistence.state.existingClaim=pvc
          reject "$key" "${source[@]}" --set=persistence.state.enabled=false
          reject "$key" --set=persistence.state.dataSourceRef.kind=VolumeSnapshot \
            --set=persistence.state.dataSourceRef.name=s
          reject "$key" --set=prometheusRule.enabled=true
          reject "$key" --set=grafanaDashboard.enabled=true \
            --set=grafanaDashboard.grafanaOperator.enabled=true

      - name: Package Chart
        env:
          VERSION: ${{ steps.gitversion.outputs.semVer }}
        run: helm package "$CHART_DIR" --version "$VERSION" --app-version "$VERSION"

      - name: Download Binaries
        uses: $/.github/actions/download-tar
        with:
          name: linux-musl-x64
          path: publish/linux-musl-x64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: recyclarr:ci

      - name: Create kind Cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2

      # Installs once per ci/*-values.yaml file, waits for readiness, and runs helm test.
      - name: Install Test
        run: |
          kind load docker-image recyclarr:ci --name chart-testing
          ct install --config .github/ct.yaml --helm-extra-set-args \
            "--set=image.repository=recyclarr --set=image.tag=ci --set=image.pullPolicy=Never"

      # The release publishes this validated package rather than repackaging the chart.
      - name: Upload Chart
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helm-chart
          path: recyclarr-${{ steps.gitversion.outputs.semVer }}.tgz
          if-no-files-found: error
