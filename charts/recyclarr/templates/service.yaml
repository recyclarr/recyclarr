apiVersion: v1
kind: Service
metadata:
  name: {{ include "recyclarr.fullname" . }}
  labels:
    {{- include "recyclarr.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: 7983
      targetPort: management
      protocol: TCP
      name: management
  selector:
    {{- include "recyclarr.selectorLabels" . | nindent 4 }}
