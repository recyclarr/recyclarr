apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "recyclarr.fullname" . }}-test-connection"
  labels:
    {{- include "recyclarr.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['-q', '-O', '-', 'http://{{ include "recyclarr.fullname" . }}:7983/readyz']
  restartPolicy: Never
