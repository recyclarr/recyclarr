{{- range $volume := list "state" "data" }}
{{- with index $.Values.persistence $volume }}
{{- if and .enabled (not .existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "recyclarr.claimName" (dict "root" $ "volume" $volume) }}
  labels:
    {{- merge (include "recyclarr.labels" $ | fromYaml) .labels | toYaml | nindent 4 }}
  {{- /* Uninstalling the chart keeps the state claim so sync state survives a reinstall. */}}
  {{- $keep := ternary (dict "helm.sh/resource-policy" "keep") dict (eq $volume "state") }}
  {{- with merge $keep .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    - {{ .accessMode }}
  {{- with .storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .size }}
{{- end }}
{{- end }}
{{- end }}
