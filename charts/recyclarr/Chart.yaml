apiVersion: v2
name: recyclarr
description: Recyclarr server, which syncs TRaSH Guides settings to Sonarr and Radarr
type: application
# The chart shares the Recyclarr version. The release workflow sets both fields from the release
# tag at package time; the committed values are placeholders.
version: 0.0.0
appVersion: "0.0.0"
home: https://recyclarr.dev
icon: https://recyclarr.dev/img/recyclarr.png
sources:
  - https://github.com/recyclarr/recyclarr
# chart-testing does not validate maintainers (.github/ct.yaml sets validate-maintainers: false).
maintainers:
  - name: rcdailey
    url: https://github.com/rcdailey
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Documentation
      url: https://recyclarr.dev/guide/installation/kubernetes/
