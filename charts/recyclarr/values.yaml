image:
  repository: ghcr.io/recyclarr/recyclarr
  # Defaults to the chart appVersion.
  tag: ~
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ~
fullnameOverride: ~

# API key clients send to the server. The chart mounts it as a file and points
# RECYCLARR_API_KEY_FILE at it. Set exactly one of existingSecret or value. The server refuses to
# start when RECYCLARR_API_KEY is also set, so the chart sets RECYCLARR_API_KEY to an empty value
# (which the server treats as unset). That overrides a RECYCLARR_API_KEY entry in a Secret or
# ConfigMap loaded through envFrom. Setting either variable in env fails rendering.
apiKey:
  existingSecret: ~
  existingSecretKey: api-key
  value: ~

# Files loaded from the configs/ directory; each key is a file name ending in .yml or .yaml.
# Content is a string, so YAML tags such as !env_var pass through unchanged.
configs:
  # Name of an existing ConfigMap whose keys are config files, for example one from a
  # Kustomize configMapGenerator. Takes the place of files. The server reads config only at
  # startup and the chart cannot track changes to a ConfigMap it does not own, so restart the
  # Deployment after editing it (or let a tool such as Reloader do it; see
  # deploymentAnnotations). The same applies to includes.existingConfigMap and
  # settings.existingConfigMap.
  existingConfigMap: ~
  files: {}
  # recyclarr.yml: |
  #   sonarr:
  #     main:
  #       base_url: http://sonarr:8989
  #       api_key: !env_var SONARR_API_KEY

# Files for the includes/ directory, referenced by include directives in configs.
includes:
  existingConfigMap: ~
  files: {}

# Content of settings.yml. Without it, the server uses default settings.
settings:
  # Name of an existing ConfigMap with a settings.yml key. Takes the place of content.
  existingConfigMap: ~
  content: ~

# Environment variables for the server, for example Sonarr and Radarr API keys used by
# !env_var in configs.
env: []
envFrom: []
# - secretRef:
#     name: recyclarr-servarr-keys

# Extra volumes for the pod and their mounts in the server container. Use them for files the
# chart does not manage, such as a secrets.yml (for !secret) or a CA bundle. A file mounted with
# subPath does not update when its source changes; restart the pod after editing the source.
extraVolumes: []
# - name: secrets
#   secret:
#     secretName: recyclarr-secrets
extraVolumeMounts: []
# - name: secrets
#   mountPath: /config/secrets.yml
#   subPath: secrets.yml
#   readOnly: true

# Storage for the state and data directories. Each volume is a PersistentVolumeClaim when
# enabled (existingClaim, or a claim the chart creates), otherwise an emptyDir that lives only as
# long as the pod. state and data cannot use the same existingClaim: both would mount the
# claim's root, and the server would refuse to start because it locks each directory.
persistence:
  # Durable state: sync state and the server database (RECYCLARR_STATE_DIR). Losing it loses
  # the mapping between Sonarr/Radarr IDs and TRaSH IDs. Uninstalling the chart keeps the claim
  # it created.
  state:
    enabled: true
    existingClaim: ~
    # Null uses the cluster default StorageClass.
    storageClass: ~
    accessMode: ReadWriteOnce
    size: 1Gi
    # Labels and annotations for the claim the chart creates, for example for backup tools.
    # The chart's helm.sh/resource-policy annotation on the state claim cannot be overridden.
    labels: {}
    annotations: {}
    # Used only when enabled is false.
    emptyDir:
      sizeLimit: ~
      # Memory uses a tmpfs, which counts against the container memory limit.
      medium: ~
  # Downloaded data: resource provider git clones, caches, and logs (RECYCLARR_DATA_DIR).
  # Losing it costs only a re-download on the next start, so an emptyDir is the default.
  data:
    enabled: false
    existingClaim: ~
    storageClass: ~
    accessMode: ReadWriteOnce
    size: 2Gi
    labels: {}
    annotations: {}
    emptyDir:
      sizeLimit: ~
      medium: ~

service:
  type: ClusterIP
  port: 7982
  # Annotations for the Service, for example for a LoadBalancer implementation.
  annotations: {}

# Prometheus Operator ServiceMonitor for /metrics on the management port.
serviceMonitor:
  enabled: false
  interval: ~
  labels: {}

serviceAccount:
  create: true
  # Recyclarr does not call the Kubernetes API. Applies to the pod, so it also holds for an
  # existing service account.
  automount: false
  annotations: {}
  name: ~

# Annotations and labels for the Deployment itself, for example
# reloader.stakater.com/auto: "true" so Reloader restarts the pod when a ConfigMap or Secret it
# uses changes. Chart labels take precedence over deploymentLabels.
deploymentAnnotations: {}
deploymentLabels: {}

# Annotations and labels for the pod. Chart labels take precedence over podLabels.
podAnnotations: {}
podLabels: {}

# PriorityClass for the pod; null uses the cluster default.
priorityClassName: ~

# Init containers that run before the server, and extra containers (sidecars) that run beside it.
# Both use the Kubernetes container spec. They can mount the chart's volumes by name (data, state,
# tmp, configs, includes, settings) and extraVolumes. The chart applies no securityContext to
# them, so set one yourself if the namespace enforces a Pod Security profile.
initContainers: []
extraContainers: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# CPU and memory for the server container. One measured server syncing a Sonarr and a Radarr
# instance peaked near 280Mi, of which about 150Mi was reclaimable file cache from the guide
# clones, and used under 3 CPU-seconds per start or sync. Larger configs use more. A CPU limit
# slows the first guide download against the startup probe budget, so this starting point sets
# none:
#   requests:
#     cpu: 50m
#     memory: 256Mi
#   limits:
#     memory: 512Mi
resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
