# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  auto_review:
    base_branches:
      - .*
    ignore_usernames:
      - renovate[bot]
      - recyclarr[bot]
  path_instructions:
    - path: src/**
      instructions: >-
        Do not comment on formatting or style; CSharpier and build-enforced analyzers handle it.
  finishing_touches:
    docstrings:
      enabled: false
  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      requirements: >-
        Conventional Commits: type(scope): subject. Types: feat, fix, perf, refactor, test,
        ci, build, docs, chore; append ! for breaking. Scope is optional; if present, one of
        deps, sync, config, yaml, cli, servarr, docker, agents.
knowledge_base:
  code_guidelines:
    filePatterns:
      - files: .opencode/skills/testing/SKILL.md
        applyTo: tests/**
      - files: .opencode/skills/mapperly/SKILL.md
        applyTo: "**/*Mapper.cs"
      - files: .opencode/skills/changelog/SKILL.md
        applyTo: CHANGELOG.md
