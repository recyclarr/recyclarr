[env]
# Keep one SDK install sufficient: let build-time .NET tools that target older runtimes (e.g.
# Refitter) run on the installed runtime. Permanent policy, not a workaround for one tool.
DOTNET_ROLL_FORWARD = "Major"
DOTNET_WATCH_RESTART_ON_RUDE_EDIT = "true"
RECYCLARR_API_KEY = "dev-server-api-key-0123456789abcdef"

[tools]
cloudflare-cf = "latest"
dotnet = "11"
ffmpeg = "latest"
"github:santhosh-tekuri/jsonschema" = "latest"
"npm:@microsoft/learn-cli" = "latest"
"npm:httpyac" = "latest"
pre-commit = "latest"
python = "latest"
ttyd = { version = "latest", os = ["linux", "windows"] }
uv = "latest"
vhs = "latest"

[tasks.demo]
description = "Record the README sync demo (.github/assets/sync-preview.webp)"
file = "scripts/record-demo.sh"

[tasks.http]
description = "Run http/<file>.http against the running server"
# Raw keeps the terminal attached so httpyac's service picker and Ctrl+C work
raw = true
usage = '''
arg "<file>" help="Request file name under http/, without the .http extension"
arg "[service]" help="Service instance to target; omit to pick it interactively"
'''
run = '''
timeout --foreground 120 httpyac send "http/${usage_file?}.http" --all --bail -o body \
    ${usage_service:+--var "service=$usage_service"}
'''
